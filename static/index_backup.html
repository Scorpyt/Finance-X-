<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance-X Terminal - Complete Trading Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #00ff00;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(0, 255, 0, 0.1));
            border: 2px solid #00ffff;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }

        .header h1 {
            color: #00ffff;
            font-size: 2.8em;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
            margin-bottom: 5px;
            letter-spacing: 3px;
        }

        .header p {
            color: #00ff00;
            font-size: 1.1em;
            letter-spacing: 1px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .cmd-btn {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
            font-family: 'Courier New', monospace;
        }

        .cmd-btn:hover {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border-color: #00ffff;
            color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .bloomberg {
            border-color: #00ffff;
            color: #00ffff;
        }

        .india {
            border-color: #ff6600;
            color: #ff6600;
        }

        .analysis {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .system {
            border-color: #ffff00;
            color: #ffff00;
        }

        .content {
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            min-height: 500px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.3);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #00ffff;
            font-size: 1.8em;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #0f3460;
            color: #00ffff;
            padding: 10px;
            text-align: left;
            border: 1px solid #00ff00;
            font-size: 0.95em;
        }

        td {
            padding: 8px;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-size: 0.9em;
        }

        tr:hover {
            background: rgba(0, 255, 255, 0.15);
        }

        .positive {
            color: #00ff00;
            font-weight: bold;
        }

        .negative {
            color: #ff0066;
            font-weight: bold;
        }

        .neutral {
            color: #ffff00;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 2px solid #00ffff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .stat-value {
            font-size: 2em;
            color: #00ffff;
            font-weight: bold;
        }

        .stat-label {
            color: #00ff00;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            background: #1a1a2e;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .search-box:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        .timestamp {
            text-align: center;
            color: #ffff00;
            margin-top: 15px;
            font-size: 0.95em;
            padding: 8px;
            background: rgba(255, 255, 0, 0.1);
            border-radius: 5px;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: rgba(15, 52, 96, 0.5);
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .status-item {
            text-align: center;
            flex: 1;
        }

        .status-label {
            color: #00ffff;
            font-size: 0.8em;
        }

        .status-value {
            color: #00ff00;
            font-size: 1.2em;
            font-weight: bold;
        }

        .section-title {
            color: #00ffff;
            font-size: 1.9em;
            margin-bottom: 12px;
            text-shadow: 0 0 10px #00ffff;
            border-bottom: 2px solid #00ffff;
            padding-bottom: 8px;
        }

        .mini-card {
            background: #16213e;
            border: 1px solid #00ffff;
            border-radius: 5px;
            padding: 10px;
            margin: 5px 0;
        }

        .mini-card h4 {
            color: #00ffff;
            margin-bottom: 5px;
        }

        .mini-card p {
            color: #00ff00;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>FINANCE-X TERMINAL</h1>
            <p>Unified Trading Intelligence | Indian Markets + Global Analysis + Bloomberg Features</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">SYSTEM STATUS</div>
                <div class="status-value" id="systemStatus">ACTIVE</div>
            </div>
            <div class="status-item">
                <div class="status-label">MARKET STATE</div>
                <div class="status-value" id="marketState">LOADING</div>
            </div>
            <div class="status-item">
                <div class="status-label">COVERAGE</div>
                <div class="status-value">240+ STOCKS</div>
            </div>
        </div>

        <div class="grid-layout">
            <!-- INDIAN MARKETS -->
            <button class="cmd-btn india" onclick="executeCommand('NIFTY')">NIFTY 50</button>
            <button class="cmd-btn india" onclick="execute Command('MOVERS')">TOP MOVERS</button>
            <button class="cmd-btn india" onclick="showSectorMenu()">SECTORS</button>

            <!-- BLOOMBERG FEATURES -->
            <button class="cmd-btn bloomberg" onclick="executeCommand('FX')">FX RATES</button>
            <button class="cmd-btn bloomberg" onclick="executeCommand('CALENDAR')">CALENDAR</button>
            <button class="cmd-btn bloomberg" onclick="showScreener()">SCREENER</button>

            <!-- ANALYSIS TOOLS -->
            <button class="cmd-btn analysis" onclick="showVolatility()">VOLATILITY</button>
            <button class="cmd-btn analysis" onclick="executeCommand('HEATMAP SECTOR')">HEATMAP</button>
            <button class="cmd-btn analysis" onclick="executeCommand('CORR')">CORRELATION</button>

            <!-- SYSTEM -->
            <button class="cmd-btn system" onclick="showStats()">STATISTICS</button>
            <button class="cmd-btn system" onclick="showSearch()">SEARCH</button>
            <button class="cmd-btn system" onclick="executeCommand('HELP')">HELP</button>
        </div>

        <div class="content" id="content">
            <div class="loading">FINANCE-X TERMINAL READY<br><br>SELECT A COMMAND ABOVE</div>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        function updateTimestamp() {
            document.getElementById('timestamp').textContent =
                'LOCAL TIME: ' + new Date().toLocaleString();
        }
        setInterval(updateTimestamp, 1000);
        updateTimestamp();

        function showLoading() {
            document.getElementById('content').innerHTML =
                '<div class="loading">PROCESSING REQUEST...</div>';
        }

        async function executeCommand(cmd) {
            showLoading();
            try {
                const response = await fetch('/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                const result = await response.json();
                renderResponse(result);
            } catch (error) {
                document.getElementById('content').innerHTML =
                    `<div style="color: #ff0066; text-align: center; padding: 40px;">ERROR: ${error.message}</div>`;
            }
        }

        function renderResponse(data) {
            const content = document.getElementById('content');
            let html = '';

            if (data.type === 'OVERVIEW_GRID') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<div class="stats-grid">';
                data.grids.forEach(stock => {
                    const changeClass = stock.change_pct > 0 ? 'positive' : 'negative';
                    html += `<div class="stat-card">
                        <div style="color: #00ffff; font-size: 1.1em; margin-bottom: 5px;">${stock.symbol}</div>
                        <div class="stat-value">${(stock.price != null ? (stock.price != null ? stock.price.toFixed(2) : '0.00') : '0.00')}</div>
                        <div class="${changeClass}">${stock.change_pct > 0 ? '+' : ''}${(stock.change_pct != null ? (stock.change_pct != null ? (stock.change_pct != null ? (stock.change_pct != null ? stock.change_pct.toFixed(2) : '0.00') : '0.00') : '0.00') : '0.00')}%</div>
                    </div>`;
                });
                html += '</div>';
            }

            else if (data.type === 'FX_VIEW') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<table><thead><tr><th>Pair</th><th>Rate</th><th>Change %</th><th>Updated</th></tr></thead><tbody>';
                data.rates.forEach(rate => {
                    const changeClass = rate.change_pct > 0 ? 'positive' : 'negative';
                    html += `<tr>
                        <td><strong>${rate.pair}</strong></td>
                        <td>${(rate.rate != null ? (rate.rate != null ? rate.rate.toFixed(4) : '0.0000') : '0.0000')}</td>
                        <td class="${changeClass}">${rate.change_pct > 0 ? '+' : ''}${(rate.change_pct != null ? (rate.change_pct != null ? (rate.change_pct != null ? (rate.change_pct != null ? rate.change_pct.toFixed(2) : '0.00') : '0.00') : '0.00') : '0.00')}%</td>
                        <td>${data.updated}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }

            else if (data.type === 'CALENDAR_VIEW') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<div style="display: grid; gap: 10px;">';
                data.events.forEach(evt => {
                    const impactColor = evt.impact === 'HIGH' ? '#ff0066' :
                        evt.impact === 'MEDIUM' ? '#ffff00' : '#00ff00';
                    html += `<div class="mini-card">
                        <h4>${evt.date} ${evt.time} - ${evt.event}</h4>
                        <p>Impact: <span style="color: ${impactColor}">${evt.impact}</span> | Currency: ${evt.currency}</p>
                    </div>`;
                });
                html += '</div>';
            }

            else if (data.type === 'SECTORS_VIEW') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<div class="stats-grid">';
                data.sectors.forEach(sector => {
                    const changeClass = sector.change_pct > 0 ? 'positive' : 'negative';
                    html += `<div class="stat-card">
                        <div style="color: #00ffff; margin-bottom: 5px;">${sector.name}</div>
                        <div class="stat-value ${changeClass}">${sector.change_pct > 0 ? '+' : ''}${(sector.change_pct != null ? (sector.change_pct != null ? (sector.change_pct != null ? (sector.change_pct != null ? sector.change_pct.toFixed(2) : '0.00') : '0.00') : '0.00') : '0.00')}%</div>
                        <div style="color: #00ff00; font-size: 0.85em; margin-top: 5px;">${sector.symbol}</div>
                    </div>`;
                });
                html += '</div>';
            }

            else if (data.type === 'MOVERS_VIEW') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">';

                html += '<div><h3 style="color: #00ff00; margin-bottom: 10px;">TOP GAINERS</h3>';
                html += '<table><thead><tr><th>Symbol</th><th>Change %</th></tr></thead><tbody>';
                data.gainers.forEach(stock => {
                    html += `<tr><td><strong>${stock.symbol}</strong></td><td class="positive">+${(stock.change_pct != null ? (stock.change_pct != null ? (stock.change_pct != null ? (stock.change_pct != null ? stock.change_pct.toFixed(2) : '0.00') : '0.00') : '0.00') : '0.00')}%</td></tr>`;
                });
                html += '</tbody></table></div>';

                html += '<div><h3 style="color: #ff0066; margin-bottom: 10px;">TOP LOSERS</h3>';
                html += '<table><thead><tr><th>Symbol</th><th>Change %</th></tr></thead><tbody>';
                data.losers.forEach(stock => {
                    html += `<tr><td><strong>${stock.symbol}</strong></td><td class="negative">${(stock.change_pct != null ? (stock.change_pct != null ? (stock.change_pct != null ? (stock.change_pct != null ? stock.change_pct.toFixed(2) : '0.00') : '0.00') : '0.00') : '0.00')}%</td></tr>`;
                });
                html += '</tbody></table></div>';
                html += '</div>';
            }

            else if (data.type === 'ERROR') {
                html = `<div style="color: #ff0066; text-align: center; padding: 40px; font-size: 1.5em;">${data.content}</div>`;
            }

            else {
                html = `<pre style="color: #00ff00; white-space: pre-wrap;">${JSON.stringify(data, null, 2)}</pre>`;
            }

            content.innerHTML = html;
        }

        function showStats() {
            executeCommand('NIFTY').then(() => {
                // After showing NIFTY, fetch additional stats from India API
                fetch('/api/stats')
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            const stats = data.data;
                            let html = '<h2 class="section-title">COVERAGE STATISTICS</h2>';
                            html += '<div class="stats-grid">';
                            html += `<div class="stat-card"><div class="stat-value">${stats.total_stocks}</div><div class="stat-label">Total Stocks</div></div>`;
                            html += `<div class="stat-card"><div class="stat-value">${stats.nifty_50}</div><div class="stat-label">NIFTY 50</div></div>`;
                            html += `<div class="stat-card"><div class="stat-value">${stats.nifty_next_50}</div><div class="stat-label">Next 50</div></div>`;
                            html += `<div class="stat-card"><div class="stat-value">${stats.midcap}</div><div class="stat-label">Midcap</div></div>`;
                            for (const [sector, count] of Object.entries(stats.sectoral)) {
                                html += `<div class="stat-card"><div class="stat-value">${count}</div><div class="stat-label">${sector.toUpperCase()}</div></div>`;
                            }
                            html += '</div>';
                            document.getElementById('content').innerHTML = html;
                        }
                    });
            });
        }

        function showSearch() {
            let html = '<h2 class="section-title">STOCK SEARCH</h2>';
            html += '<input type="text" class="search-box" id="searchInput" placeholder="Enter stock symbol or name (TATA, RELIANCE, INFY...)" autofocus>';
            html += '<div id="searchResults"></div>';
            document.getElementById('content').innerHTML = html;

            document.getElementById('searchInput').addEventListener('keyup', async (e) => {
                const query = e.target.value;
                if (query.length >= 2) {
                    const response = await fetch(`/api/search?q=${query}`);
                    const result = await response.json();

                    if (result.success && result.data.length > 0) {
                        let html = '<table><thead><tr><th>Symbol</th><th>Category</th><th>Type</th></tr></thead><tbody>';
                        result.data.forEach(stock => {
                            html += `<tr><td><strong>${stock.symbol}</strong></td><td>${stock.category}</td><td>${stock.type}</td></tr>`;
                        });
                        html += '</tbody></table>';
                        document.getElementById('searchResults').innerHTML = html;
                    } else if (query.length >= 2) {
                        document.getElementById('searchResults').innerHTML =
                            '<p style="color: #ff0066; margin-top: 20px;">No stocks found</p>';
                    }
                }
            });
        }

        function showSectorMenu() {
            let html = '<h2 class="section-title">SELECT SECTOR</h2>';
            html += '<div class="grid-layout">';
            const sectors = ['BANK', 'IT', 'PHARMA', 'AUTO', 'FMCG', 'METAL', 'ENERGY'];
            sectors.forEach(sector => {
                html += `<button class="cmd-btn india" style="padding: 20px; font-size: 1.1em;" onclick="executeCommand('SCREEN ${sector}')">${sector}</button>`;
            });
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function showScreener() {
            let html = '<h2 class="section-title">STOCK SCREENER</h2>';
            html += '<div class="grid-layout">';
            ['GAINERS', 'LOSERS', 'VOLUME', 'VOLATILITY'].forEach(criteria => {
                html += `<button class="cmd-btn bloomberg" style="padding: 20px; font-size: 1.1em;" onclick="executeCommand('SCREEN ${criteria}')">${criteria}</button>`;
            });
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function showVolatility() {
            let html = '<h2 class="section-title">VOLATILITY ANALYSIS</h2>';
            html += '<input type="text" class="search-box" placeholder="Enter symbol (e.g., TCS, RELIANCE)" onkeypress="if(event.key===\'Enter\') executeCommand(\'VOL \' + this.value)">';
            html += '<button class="cmd-btn analysis" style="width: 100%; margin-top: 10px; padding: 15px;" onclick="executeCommand(\'VOLSCAN\')">SCAN HIGH VOLATILITY STOCKS</button>';
            document.getElementById('content').innerHTML = html;
        }

        // Auto-load market overview on page load
        setTimeout(() => executeCommand('OVERVIEW'), 800);

        // Update system status
        setInterval(async () => {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                document.getElementById('marketState').textContent = data.state;
            } catch (e) { }
        }, 5000);
    </script>
</body>

</html>
