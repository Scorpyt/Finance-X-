<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance-X Terminal - Real-Time Trading Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-surface: #18181b;
            --bg-elevated: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent-cyan: #22d3ee;
            --accent-emerald: #34d399;
            --accent-red: #f87171;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container {
            display: grid;
            grid-template-columns: 240px 1fr 320px;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-surface);
            border-right: 1px solid var(--bg-elevated);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .nav-btn {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            font-family: var(--font-sans);
            transition: all 0.2s;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .nav-btn.active {
            background: rgba(34, 211, 238, 0.1);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Main Content */
        .main-content {
            background: var(--bg-primary);
            overflow-y: auto;
            padding: 24px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .content-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .cmd-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .cmd-input {
            background: var(--bg-surface);
            border: 1px solid var(--bg-elevated);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 13px;
            width: 280px;
            transition: all 0.2s;
        }

        .cmd-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }

        .content-body {
            min-height: 400px;
        }

        /* Stock Grid */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .stock-card {
            background: var(--bg-surface);
            border: 1px solid var(--bg-elevated);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stock-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .stock-symbol {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 8px;
        }

        .stock-price {
            font-size: 18px;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .stock-change {
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-mono);
        }

        .stock-change.up {
            color: var(--accent-emerald);
        }

        .stock-change.down {
            color: var(--accent-red);
        }

        /* Detail Panel */
        .detail-panel {
            background: var(--bg-surface);
            border-left: 1px solid var(--bg-elevated);
            padding: 20px;
            overflow-y: auto;
        }

        .detail-header {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--bg-elevated);
        }

        .detail-content {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg-elevated);
            color: var(--accent-cyan);
            padding: 12px;
            font-size: 11px;
            font-weight: 600;
            text-align: left;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px;
            font-size: 13px;
            border-bottom: 1px solid var(--bg-elevated);
            color: var(--text-secondary);
        }

        tr:hover td {
            background: rgba(34, 211, 238, 0.05);
        }

        .positive {
            color: var(--accent-emerald) !important;
        }

        .negative {
            color: var(--accent-red) !important;
        }

        /* Section Title */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--bg-elevated);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            gap: 24px;
            padding: 12px 16px;
            background: var(--bg-surface);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .status-label {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .status-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-cyan);
            font-family: var(--font-mono);
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-elevated);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .info-card {
            background: var(--bg-surface);
            border: 1px solid var(--bg-elevated);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }

        .info-card:hover {
            border-color: var(--accent-cyan);
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-cyan);
            font-family: var(--font-mono);
        }

        .card-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Action Buttons */
        .action-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--bg-elevated);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: var(--bg-primary);
        }

        /* Mini Card for Calendar etc */
        .mini-card {
            background: var(--bg-elevated);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .mini-card h4 {
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .mini-card p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .app-container {
                grid-template-columns: 200px 1fr 280px;
            }
        }

        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            .sidebar,
            .detail-panel {
                display: none;
            }
        }

        .time-btn.active {
            background: var(--accent-cyan) !important;
            color: var(--bg-primary) !important;
            border-color: var(--accent-cyan) !important;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">FINANCE-X</div>
            <div class="logo-sub">Real-Time Trading Intelligence</div>

            <nav>
                <div class="nav-section">
                    <div class="nav-label">MARKETS</div>
                    <button class="nav-btn active" onclick="executeCommand('NIFTY')">📊 NIFTY 50</button>
                    <button class="nav-btn" onclick="executeCommand('MOVERS')">📈 Top Movers</button>
                    <button class="nav-btn" onclick="executeCommand('SECTORS')">🏢 Sectors</button>
                </div>

                <div class="nav-section">
                    <div class="nav-label">BLOOMBERG</div>
                    <button class="nav-btn" onclick="executeCommand('FX')">💱 FX Rates</button>
                    <button class="nav-btn" onclick="executeCommand('CALENDAR')">📅 Calendar</button>
                    <button class="nav-btn" onclick="showScreener()">🔍 Screener</button>
                </div>

                <div class="nav-section">
                    <div class="nav-label">ANALYSIS</div>
                    <button class="nav-btn" onclick="showVolatility()">📉 Volatility</button>
                    <button class="nav-btn" onclick="executeCommand('HEATMAP SECTOR')">🗺️ Heatmap</button>
                    <button class="nav-btn" onclick="executeCommand('CORR')">🔗 Correlation</button>
                </div>

                <div class="nav-section">
                    <div class="nav-label">SYSTEM</div>
                    <button class="nav-btn" onclick="showStats()">📊 Statistics</button>
                    <button class="nav-btn" onclick="showSearch()">🔍 Search</button>
                    <button class="nav-btn" onclick="executeCommand('HELP')">❓ Help</button>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1 class="content-title" id="contentTitle">Dashboard</h1>
                <div class="cmd-input-wrapper">
                    <input type="text" class="cmd-input" id="cmdInput" placeholder="Type command..."
                        onkeypress="if(event.key==='Enter') executeCommand(this.value)">
                </div>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">STATUS</span>
                    <span class="status-value" id="systemStatus">ACTIVE</span>
                </div>
                <div class="status-item">
                    <span class="status-label">MARKET</span>
                    <span class="status-value" id="marketState">LOADING</span>
                </div>
                <div class="status-item">
                    <span class="status-label">TIME</span>
                    <span class="status-value" id="liveClock">--:--:--</span>
                </div>
            </div>

            <div class="content-body" id="content">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <span>Loading market data...</span>
                </div>
            </div>
        </main>

        <!-- Detail Panel -->
        <aside class="detail-panel" id="detailPanel">
            <div class="detail-header">Quick Info</div>
            <div class="detail-content">
                <p style="color: var(--text-secondary); font-size: 13px;">
                    Click on any stock card or navigation item to see detailed information, charts, and analysis here.
                </p>
            </div>
        </aside>
    </div>

    <script>
        // Clock
        function updateClock() {
            document.getElementById('liveClock').textContent = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Active Chart Instance
        let activeChart = null;

        function showLoading() {
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <span>Processing request...</span>
                </div>
            `;
        }

        async function executeCommand(cmd) {
            showLoading();
            document.getElementById('contentTitle').textContent = cmd;

            // Update active nav button
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            try {
                const response = await fetch('/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                const result = await response.json();
                renderResponse(result);
            } catch (error) {
                document.getElementById('content').innerHTML =
                    `<div style="color: var(--accent-red); text-align: center; padding: 60px;">ERROR: ${error.message}</div>`;
            }
        }

        function renderResponse(data) {
            const content = document.getElementById('content');
            let html = '';
            console.log('API Response:', data);
            console.log('Type:', data.type);

            if (data.type === 'OVERVIEW_GRID') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<div class="stock-grid">';
                (data.grids || []).forEach(stock => {
                    const price = stock.price != null ? stock.price.toFixed(2) : '0.00';
                    const change = stock.change_pct != null ? stock.change_pct.toFixed(2) : '0.00';
                    const changeClass = stock.change_pct >= 0 ? 'up' : 'down';
                    const sign = stock.change_pct >= 0 ? '+' : '';
                    html += `
                        <div class="stock-card" onclick="showStockDetail('${stock.symbol}', ${stock.price || 0}, ${stock.change_pct || 0})">
                            <div class="stock-symbol">${stock.symbol}</div>
                            <div class="stock-price">₹${price}</div>
                            <div class="stock-change ${changeClass}">${sign}${change}%</div>
                        </div>
                    `;
                });
                html += '</div>';
                showViewExplanation('NIFTY');
            }

            else if (data.type === 'FX_VIEW') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<table><thead><tr><th>Pair</th><th>Rate</th><th>Change %</th><th>Updated</th></tr></thead><tbody>';
                (data.rates || []).forEach(rate => {
                    const rateVal = rate.rate != null ? rate.rate.toFixed(4) : '0.0000';
                    const change = rate.change_pct != null ? rate.change_pct.toFixed(2) : '0.00';
                    const changeClass = rate.change_pct > 0 ? 'positive' : 'negative';
                    html += `<tr>
                        <td><strong>${rate.pair}</strong></td>
                        <td>${rateVal}</td>
                        <td class="${changeClass}">${rate.change_pct > 0 ? '+' : ''}${change}%</td>
                        <td>${data.updated}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                showViewExplanation('FX');
            }

            else if (data.type === 'CALENDAR_VIEW') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<div style="display: grid; gap: 10px;">';
                (data.events || []).forEach(evt => {
                    const impactColor = evt.impact === 'HIGH' ? 'var(--accent-red)' :
                        evt.impact === 'MEDIUM' ? '#fbbf24' : 'var(--accent-emerald)';
                    html += `<div class="mini-card">
                        <h4>${evt.date} ${evt.time} - ${evt.event}</h4>
                        <p>Impact: <span style="color: ${impactColor}">${evt.impact}</span> | Currency: ${evt.currency}</p>
                    </div>`;
                });
                html += '</div>';
                showViewExplanation('CALENDAR');
            }

            else if (data.type === 'SECTORS_VIEW') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<div class="cards-grid">';
                (data.sectors || []).forEach(sector => {
                    const change = sector.change_pct != null ? sector.change_pct.toFixed(2) : '0.00';
                    const changeClass = sector.change_pct > 0 ? 'positive' : 'negative';
                    html += `<div class="info-card">
                        <div style="color: var(--accent-cyan); margin-bottom: 8px;">${sector.name}</div>
                        <div class="card-value ${changeClass}">${sector.change_pct > 0 ? '+' : ''}${change}%</div>
                        <div class="card-label">${sector.symbol}</div>
                    </div>`;
                });
                html += '</div>';
                showViewExplanation('SECTORS');
            }

            else if (data.type === 'MOVERS_VIEW') {
                html = `<h2 class="section-title">${data.title}</h2>`;
                html += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">';

                html += '<div><h3 style="color: var(--accent-emerald); margin-bottom: 12px;">TOP GAINERS</h3>';
                html += '<table><thead><tr><th>Symbol</th><th>Change %</th></tr></thead><tbody>';
                (data.gainers || []).forEach(stock => {
                    const change = stock.change_pct != null ? stock.change_pct.toFixed(2) : '0.00';
                    html += `<tr><td><strong>${stock.symbol}</strong></td><td class="positive">+${change}%</td></tr>`;
                });
                html += '</tbody></table></div>';

                html += '<div><h3 style="color: var(--accent-red); margin-bottom: 12px;">TOP LOSERS</h3>';
                html += '<table><thead><tr><th>Symbol</th><th>Change %</th></tr></thead><tbody>';
                (data.losers || []).forEach(stock => {
                    const change = stock.change_pct != null ? stock.change_pct.toFixed(2) : '0.00';
                    html += `<tr><td><strong>${stock.symbol}</strong></td><td class="negative">${change}%</td></tr>`;
                });
                html += '</tbody></table></div>';
                html += '</div>';
                showViewExplanation('MOVERS');
            }

            else if (data.type === 'HELP' || data.type === 'HELP_MENU') {
                html = `<h2 class="section-title">Command Reference</h2>`;
                if (data.sections) {
                    data.sections.forEach(section => {
                        html += `<div style="margin-bottom: 20px;">
                            <h3 style="color: var(--accent-cyan); font-size: 14px; margin-bottom: 8px;">${section.category}</h3>
                            <div style="color: var(--text-secondary); font-size: 13px;">
                                ${section.cmds.map(c => `<div style="padding: 4px 0;">${c}</div>`).join('')}
                            </div>
                        </div>`;
                    });
                } else {
                    html += `<pre style="color: var(--text-secondary); white-space: pre-wrap;">${JSON.stringify(data, null, 2)}</pre>`;
                }
            }

            else if (data.type === 'ERROR') {
                html = `<div style="color: var(--accent-red); text-align: center; padding: 60px; font-size: 16px;">${data.content}</div>`;
            }




            // CHART_FULL - Interactive Real-Time Chart View
            else if (data.type === 'CHART_FULL' || data.type === 'CHART') {
                var sym = data.symbol || '';
                currentChartSymbol = sym;

                html = '<h2 class="section-title">Live Chart: ' + sym + ' <span id="liveIndic"color: var(--accent-emerald); font-size: 12px; animation: pulse 2s infinite;">● LIVE</span></h2>';

                // Time range selector
                html += '<div style="display: flex; gap: 8px; margin-bottom: 16px;">';
                html += '<button class="action-btn time-btn active" onclick="changeTimeRange(\'' + sym + '\', \'1d\')" id="btn-1d">1D</button>';
                html += '<button class="action-btn time-btn" onclick="changeTimeRange(\'' + sym + '\', \'5d\')" id="btn-5d">5D</button>';
                html += '<button class="action-btn time-btn" onclick="changeTimeRange(\'' + sym + '\', \'1mo\')" id="btn-1mo">1M</button>';
                html += '<button class="action-btn time-btn" onclick="changeTimeRange(\'' + sym + '\', \'3mo\')" id="btn-3mo">3M</button>';
                html += '<button class="action-btn time-btn" onclick="changeTimeRange(\'' + sym + '\', \'1y\')" id="btn-1y">1Y</button>';
                html += '</div>';

                // Price display
                var lastPrice = data.history && data.history.length > 0 ? data.history[data.history.length - 1].p : 0;
                var firstPrice = data.history && data.history.length > 0 ? data.history[0].p : 0;
                var priceChange = lastPrice - firstPrice;
                var pctChange = firstPrice > 0 ? ((priceChange / firstPrice) * 100) : 0;
                var isUp = priceChange >= 0;

                html += '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 16px; background: var(--bg-surface); border-radius: 8px;">';
                html += '<div><span style="font-size: 32px; font-weight: 700; font-family: var(--font-mono); color: var(--accent-cyan);" id="livePrice">Rs.' + lastPrice.toFixed(2) + '</span>';
                html += '<span id="priceChange" style="margin-left: 12px; font-size: 16px; color: ' + (isUp ? 'var(--accent-emerald)' : 'var(--accent-red)') + ';">' + (isUp ? '+' : '') + priceChange.toFixed(2) + ' (' + (isUp ? '+' : '') + pctChange.toFixed(2) + '%)</span></div>';
                html += '<div id="lastUpdate" style="font-size: 11px; color: var(--text-secondary);">Updated: ' + new Date().toLocaleTimeString() + '</div>';
                html += '</div>';

                // Chart container
                html += '<div class="info-card" style="height: 350px; padding: 16px; position: relative;">';
                html += '<canvas id="mainChart"></canvas>';
                html += '<div id="chartOverlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none;"><div class="loading-spinner"></div></div>';
                html += '</div>';

                // Controls
                html += '<div style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;">';
                html += '<button class="action-btn" onclutoRefresh()" id="autoRefreshBtn" style="flex: 1;">Auto-Refresh: ON</button>';
                html += '<button class="action-btn" onclick="refreshChart(\'' + sym + '\')" style="flex: 1;">Refresh Now</button>';
                html += '<button class="action-btn" onclick="executeCommand(\'EVAL ' + sym + '\')" style="flex: 1;">Analysis</button>';
                html += '<button class="action-btn" onclick="executeCommand(\'VOL ' + sym + '\')" style="flex: 1;">Volatility</button>';
                html += '</div>';

                content.innerHTML = html;

                // Initialize chart
                initInteractiveChart(data.history || [], sym);

                // Start auto-refresh
                startChartAutoRefresh(sym);

                return;
            }

            // REPORT type (from EVAL, RISKS, ADVISE commands)

        function getStockAnalysis(symbol, changePct) {
            if (changePct > 3) return `${symbol} is showing strong bullish momentum (+${changePct.toFixed(1)}%). This could indicate positive sentiment or news. Consider checking volume for confirmation.`;
            if (changePct > 0) return `${symbol} is in a mild uptrend (+${changePct.toFixed(1)}%). The stock is showing positive performance today with moderate gains.`;
            if (changePct > -3) return `${symbol} is experiencing a slight pullback (${changePct.toFixed(1)}%). This could be normal market fluctuation or profit booking.`;
            return `${symbol} is under selling pressure (${changePct.toFixed(1)}%). Watch for support levels and check for any negative news.`;
        }

        function drawMiniChart(symbol, changePct) {
            const ctx = document.getElementById('detailChart');
            if (!ctx) return;

            const isUp = changePct >= 0;
            const color = isUp ? 'rgb(52, 211, 153)' : 'rgb(248, 113, 113)';

            // Generate sample trend data
            const baseVal = 100;
            const data = [];
            for (let i = 0; i < 20; i++) {
                const trend = isUp ? (i * changePct / 20) : (i * changePct / 20);
                data.push(baseVal + trend + (Math.random() - 0.5) * 2);
            }

            activeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map((_, i) => i),
                    datasets: [{
                        data: data,
                        borderColor: color,
                        backgroundColor: color.replace('rgb', 'rgba').replace(')', ', 0.1)'),
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }

        // ========== INTERACTIVE CHART FUNCTIONS ==========
        var currentChartSymbol = '';
        var chartAutoRefreshInterval = null;
        var autoRefreshEnabled = true;
        var chartAnimationFrame = null;

        function initInteractiveChart(history, symbol) {
            setTimeout(function () {
                var ctx = document.getElementById('mainChart');
                if (!ctx) return;

                var prices = history.map(function (h) { return h.p || 0; });
                var labels = history.map(function (h, i) { return h.t || ('Point ' + i); });
                var volumes = history.map(function (h) { return h.v || 0; });
                var isUp = prices.length > 1 ? prices[prices.length - 1] >= prices[0] : true;
                var color = isUp ? 'rgb(52, 211, 153)' : 'rgb(248, 113, 113)';
                var bgColor = isUp ? 'rgba(52, 211, 153, 0.15)' : 'rgba(248, 113, 113, 0.15)';

                if (activeChart) { activeChart.destroy(); }

                activeChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: symbol + ' Price',
                            data: prices,
                            borderColor: color,
                            backgroundColor: bgColor,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 2,
                            pointHoverRadius: 8,
                            pointBackgroundColor: color,
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2,
                            borderWidth: 2.5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 750, easing: 'easeOutQuart' },
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                backgroundColor: 'rgba(24, 24, 27, 0.95)',
                                titleColor: '#22d3ee',
                                bodyColor: '#fafafa',
                                borderColor: '#27272a',
                                borderWidth: 1,
                                padding: 12,
                                displayColors: false,
                                callbacks: {
                                    label: function (context) {
                                        return 'Rs. ' + context.parsed.y.toFixed(2);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                display: true,
                                grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                                ticks: { color: '#71717a', maxRotation: 0, maxTicksLimit: 8 }
                            },
                            y: {
                                display: true,

                                grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },

                                }
                            }

                    }

            }, 100);
        }

        function startChartAutoRefresh(symbol) {
            if (chartAutoRefreshInterval) clearInterval(chartAutoRefreshInterval);

            chartAutoRefreshInterval = setInterval(function () {
                if (!autoRefreshEnabled || currentChartSymbol !== symbol) {
                    clearInterval(chartAutoRefreshInterval);
                    return;
                }
                refreshChart(symbol, true);
            }, 10000); // Refresh every 10 seconds
        }

        async function refreshChart(symbol, silent) {
            if (!silent) {
                var overlay = document.getElementById('chartOverlay');
                if (overlay) overlay.style.display = 'block';
            }

            try {
                var response = await fetch('/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: 'CHART ' + symbol })
                });
                var data = await response.json();

                if (data.history && activeChart) {
                    var prices = data.history.map(function (h) { return h.p || 0; });
                    var labels = data.history.map(function (h, i) { return h.t || ('Point ' + i); });

                    activeChart.data.labels = labels;
                    activeChart.data.datasets[0].data = prices;

                    var isUp = prices.length > 1 ? prices[prices.length - 1] >= prices[0] : true;
                    activeChart.data.datasets[0].borderColor = isUp ? 'rgb(52, 211, 153)' : 'rgb(248, 113, 113)';
                    activeChart.data.datasets[0].backgroundColor = isUp ? 'rgba(52, 211, 153, 0.15)' : 'rgba(248, 113, 113, 0.15)';

                    activeChart.update('none');

                    // Update price display
                    var lastPrice = prices[prices.length - 1] || 0;
                    var firstPrice = prices[0] || 0;
                    var priceChange = lastPrice - firstPrice;
                    var pctChange = firstPrice > 0 ? ((priceChange / firstPrice) * 100) : 0;

                    var priceEl = document.getElementById('livePrice');
                    var changeEl = document.getElementById('priceChange');
                    var updateEl = document.getElementById('lastUpdate');

                    if (priceEl) priceEl.textContent = 'Rs.' + lastPrice.toFixed(2);
                    if (changeEl) {
                        changeEl.textContent = (priceChange >= 0 ? '+' : '') + priceChange.toFixed(2) + ' (' + (priceChange >= 0 ? '+' : '') + pctChange.toFixed(2) + '%)';
                        changeEl.style.color = priceChange >= 0 ? 'var(--accent-emerald)' : 'var(--accent-red)';
                    }
                    if (updateEl) updateEl.textContent = 'Updated: ' + new Date().toLocaleTimeString();
                }
            } catch (error) {
                console.error('Chart refresh error:', error);
            }

            var overlay = document.getElementById('chartOverlay');
            if (overlay) overlay.style.display = 'none';
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            var btn = document.getElementById('autoRefreshBtn');
            var indicator = document.getElementById('liveIndicator');

            if (btn) btn.textContent = 'Auto-Refresh: ' + (autoRefreshEnabled ? 'ON' : 'OFF');
            if (indicator) indicator.style.display = autoRefreshEnabled ? 'inline' : 'none';

            if (autoRefreshEnabled && currentChartSymbol) {
                startChartAutoRefresh(currentChartSymbol);
            }
        }

        async function changeTimeRange(symbol, range) {
            // Update button styles
            document.querySelectorAll('.time-btn').forEach(function (btn) { btn.classList.remove('active'); });
            var activeBtn = document.getElementById('btn-' + range);
            if (activeBtn) activeBtn.classList.add('active');

            var overlay = document.getElementById('chartOverlay');
            if (overlay) overlay.style.display = 'block';

            try {
                // For now, just refresh - in a real implementation, you'd pass the range to the API
                await refreshChart(symbol);
            } catch (error) {
                console.error('Time range change error:', error);
            }

            if (overlay) overlay.style.display = 'none';
        }

        // Load stocks from a sector when clicking heatmap
        async function loadSectorStocks(sectorName) {
            showLoading();
            document.getElementById('contentTitle').textContent = sectorName + ' STOCKS';

            // Map sector names to API sector codes
            const sectorMap = {
                'Consumer': 'FMCG',
                'Real Estate': 'REALTY',
                'Materials': 'METAL',
                'Healthcare': 'PHARMA',
                'Technology': 'IT',
                'Finance': 'BANK',
                'Energy': 'ENERGY',
                'Automobile': 'AUTO'
            };

            const sectorCode = sectorMap[sectorName] || sectorName.toUpperCase().replace(/\s+/g, '');

            try {
                const response = await fetch('/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: 'SECTOR ' + sectorCode })
                });
                const result = await response.json();

                // Render as heatmap-style stock grid
                const content = document.getElementById('content');
                let html = '<h2 class="section-title">' + sectorName + ' Sector Stocks</h2>';
                html += '<p style="color: var(--text-secondary); font-size: 12px; margin-bottom: 16px;">Click any stock for detailed analysis</p>';
                html += '<button class="action-btn" onclick="executeCommand(\'HEATMAP SECTOR\')" style="margin-bottom: 16px;">← Back to Sectors</button>';
                html += '<div class="stock-grid">';

                const stocks = result.grids || result.data || [];
                stocks.forEach(function (stock) {
                    const price = stock.price ? stock.price.toFixed(2) : '0.00';
                    const changePct = stock.change_pct || 0;
                    const intensity = Math.min(Math.abs(changePct) / 5 + 0.3, 1);
                    const bgColor = changePct >= 0 ?
                        'rgba(52, 211, 153, ' + intensity + ')' :
                        'rgba(248, 113, 113, ' + intensity + ')';

                    html += '<div class="stock-card" onclick="showFullStockDetail(\'' + stock.symbol + '\')" style="background: ' + bgColor + '; border-color: transparent;">';
                    html += '<div class="stock-symbol">' + stock.symbol + '</div>';
                    html += '<div class="stock-price">Rs.' + price + '</div>';
                    html += '<div class="stock-change ' + (changePct >= 0 ? 'up' : 'down') + '">' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%</div>';
                    html += '</div>';
                });
                html += '</div>';
                content.innerHTML = html;
            } catch (error) {
                document.getElementById('content').innerHTML = '<div style="color: var(--accent-red); padding: 40px;">Error loading sector: ' + error.message + '</div>';
            }
        }

        // Comprehensive stock detail with full analysis
        async function showFullStockDetail(symbol) {
            if (activeChart) { activeChart.destroy(); activeChart = null; }

            document.getElementById('detailPanel').innerHTML = '<div class="detail-header">' + symbol + '</div><div class="detail-content"><div class="loading"><div class="loading-spinner"></div><span>Loading analysis...</span></div></div>';

            try {
                // Fetch detailed analysis
                const response = await fetch('/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: 'EVAL ' + symbol })
                });
                const data = await response.json();

                const price = data.details ? data.details.match(/PRICE: ([\d.]+)/) : null;
                const priceVal = price ? price[1] : '0.00';
                const isUp = data.state && data.state.includes('UP');
                const trendClass = isUp ? 'positive' : 'negative';
                const stateColor = isUp ? 'var(--accent-emerald)' : 'var(--accent-red)';

                document.getElementById('detailPanel').innerHTML = `
                    <div class="detail-header">${symbol}</div>
                    <div class="detail-content">
                        <div style="margin-bottom: 20px;">
                            <div style="font-size: 28px; font-weight: 700; color: var(--accent-cyan); font-family: var(--font-mono);">Rs.${priceVal}</div>
                            <div style="font-size: 16px; font-weight: 600; color: ${stateColor}; margin-top: 8px;">${data.state || 'N/A'}</div>
                        </div>
                        
                        <div style="height: 140px; margin-bottom: 20px; background: var(--bg-elevated); border-radius: 8px; padding: 8px;">
                            <canvas id="detailChart"></canvas>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <h4 style="color: var(--accent-cyan); font-size: 12px; margin-bottom: 10px;">DETAILED ANALYSIS</h4>
                            <pre style="font-size: 11px; color: var(--text-secondary); line-height: 1.7; white-space: pre-wrap; background: var(--bg-elevated); padding: 12px; border-radius: 8px;">${data.details || 'No analysis available'}</pre>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <h4 style="color: var(--accent-cyan); font-size: 12px; margin-bottom: 8px;">KEY METRICS</h4>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                <div style="background: var(--bg-elevated); padding: 10px; border-radius: 6px; text-align: center;">
                                    <div style="font-size: 10px; color: var(--text-secondary);">RISK SCORE</div>
                                    <div style="font-size: 16px; font-weight: 700; color: var(--accent-cyan);">${data.risk_score || 0}</div>
                                </div>
                                <div style="background: var(--bg-elevated); padding: 10px; border-radius: 6px; text-align: center;">
                                    <div style="font-size: 10px; color: var(--text-secondary);">TREND</div>
                                    <div style="font-size: 14px; font-weight: 600; color: ${stateColor};">${isUp ? 'BULLISH' : 'BEARISH'}</div>
                                </div>
                            </div>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <h4 style="color: var(--accent-cyan); font-size: 12px; margin-bottom: 8px;">RESEARCH LINKS</h4>
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                <a href="https://www.google.com/search?q=${symbol}+NSE+stock+news&tbm=nws" target="_blank" style="color: var(--accent-emerald); font-size: 11px; text-decoration: none;">→ Google News: ${symbol}</a>
                                <a href="https://www.moneycontrol.com/india/stockpricequote/" target="_blank" style="color: var(--accent-emerald); font-size: 11px; text-decoration: none;">→ MoneyControl Analysis</a>
                                <a href="https://www.screener.in/company/${symbol}/" target="_blank" style="color: var(--accent-emerald); font-size: 11px; text-decoration: none;">→ Screener.in Fundamentals</a>
                                <a href="https://www.tradingview.com/symbols/NSE-${symbol}/" target="_blank" style="color: var(--accent-emerald); font-size: 11px; text-decoration: none;">→ TradingView Charts</a>
                                <a href="https://economictimes.indiatimes.com/markets/stocks" target="_blank" style="color: var(--accent-emerald); font-size: 11px; text-decoration: none;">→ Economic Times Markets</a>
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 8px;">
                            <button class="action-btn" onclick="executeCommand('CHART ${symbol}')" style="flex: 1;">Full Chart</button>
                            <button class="action-btn" onclick="executeCommand('VOL ${symbol}')" style="flex: 1;">Volatility</button>
                        </div>
                    </div>
                `;

                // Draw chart
                setTimeout(function () {
                    const ctx = document.getElementById('detailChart');
                    if (!ctx) return;
                    const chartData = [];
                    for (let i = 0; i < 30; i++) {
                        chartData.push(100 + (isUp ? 1 : -1) * i * 0.5 + (Math.random() - 0.5) * 3);
                    }
                    activeChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: chartData.map(function (_, i) { return i; }),
                            datasets: [{
                                data: chartData,
                                borderColor: isUp ? 'rgb(52, 211, 153)' : 'rgb(248, 113, 113)',
                                backgroundColor: isUp ? 'rgba(52, 211, 153, 0.1)' : 'rgba(248, 113, 113, 0.1)',
                                fill: true,
                                tension: 0.4,
                                pointRadius: 0,
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { x: { display: false }, y: { display: false } }
                        }
                    });
                }, 100);

            } catch (error) {
                document.getElementById('detailPanel').innerHTML = '<div class="detail-header">' + symbol + '</div><div class="detail-content"><p style="color: var(--accent-red);">Error: ' + error.message + '</p></div>';
            }
        }

        function showStats() {
            executeCommand('NIFTY').then(() => {
                fetch('/api/stats')
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            const stats = data.data;
                            let html = '<h2 class="section-title">COVERAGE STATISTICS</h2>';
                            html += '<div class="cards-grid">';
                            html += `<div class="info-card"><div class="card-value">${stats.total_stocks}</div><div class="card-label">Total Stocks</div></div>`;
                            html += `<div class="info-card"><div class="card-value">${stats.nifty_50}</div><div class="card-label">NIFTY 50</div></div>`;
                            html += `<div class="info-card"><div class="card-value">${stats.nifty_next_50}</div><div class="card-label">Next 50</div></div>`;
                            html += `<div class="info-card"><div class="card-value">${stats.midcap}</div><div class="card-label">Midcap</div></div>`;
                            for (const [sector, count] of Object.entries(stats.sectoral)) {
                                html += `<div class="info-card"><div class="card-value">${count}</div><div class="card-label">${sector.toUpperCase()}</div></div>`;
                            }
                            html += '</div>';
                            document.getElementById('content').innerHTML = html;
                        }
                    });
            });
        }

        function showSearch() {
            let html = '<h2 class="section-title">STOCK SEARCH</h2>';
            html += '<input type="text" class="cmd-input" style="width: 100%; margin-bottom: 16px;" id="searchInput" placeholder="Enter stock symbol or name..." autofocus>';
            html += '<div id="searchResults"></div>';
            document.getElementById('content').innerHTML = html;

            document.getElementById('searchInput').addEventListener('keyup', async (e) => {
                const query = e.target.value;
                if (query.length >= 2) {
                    const response = await fetch(`/api/search?q=${query}`);
                    const result = await response.json();

                    if (result.success && result.data.length > 0) {
                        let html = '<table><thead><tr><th>Symbol</th><th>Category</th><th>Type</th></tr></thead><tbody>';
                        result.data.forEach(stock => {
                            html += `<tr onclick="showStockDetail('${stock.symbol}', 0, 0)" style="cursor: pointer;">
                                <td><strong>${stock.symbol}</strong></td><td>${stock.category}</td><td>${stock.type}</td></tr>`;
                        });
                        html += '</tbody></table>';
                        document.getElementById('searchResults').innerHTML = html;
                    } else {
                        document.getElementById('searchResults').innerHTML = '<p style="color: var(--accent-red); margin-top: 20px;">No stocks found</p>';
                    }
                }
            });
        }

        function showScreener() {
            let html = '<h2 class="section-title">STOCK SCREENER</h2>';
            html += '<div class="cards-grid">';
            ['GAINERS', 'LOSERS', 'VOLUME', 'VOLATILITY'].forEach(criteria => {
                html += `<div class="info-card" style="cursor: pointer;" onclick="executeCommand('SCREEN ${criteria}')">
                    <div style="font-size: 24px; margin-bottom: 8px;">📊</div>
                    <div style="color: var(--accent-cyan); font-weight: 600;">${criteria}</div>
                </div>`;
            });
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function showVolatility() {
            let html = '<h2 class="section-title">VOLATILITY ANALYSIS</h2>';
            html += '<input type="text" class="cmd-input" style="width: 100%; margin-bottom: 16px;" placeholder="Enter symbol (e.g., TCS, RELIANCE)" onkeypress="if(event.key===\'Enter\') executeCommand(\'VOL \' + this.value)">';
            html += '<button class="action-btn" style="width: 100%;" onclick="executeCommand(\'VOLSCAN\')">SCAN HIGH VOLATILITY STOCKS</button>';
            document.getElementById('content').innerHTML = html;
        }

        // Auto-load on page start
        setTimeout(() => executeCommand('NIFTY'), 500);

        // Status polling
        setInterval(async () => {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                document.getElementById('marketState').textContent = data.state || 'ACTIVE';
            } catch (e) { }
        }, 5000);
    </script>
</body>

</html>
